name: Containers
on:
  # Be able to run the job manually when needed
  # (Actions -> Containers -> Run workflow)
  workflow_dispatch:
  # Build every week on Monday 00:00
  # schedule:
  #   - cron:  '0 0 * * 1'
  push:
# env:
# IMAGE_REGISTRY: quay.io/ovirt
# can_push: ${{ github.repository_owner == 'oVirt' }}
jobs:
  test-containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # distro: [ centos-9, centos-10, fedora-40, fedora-41 ]
        distro: [fedora-riscv-41]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install podman
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Build container images
        working-directory: containers
        run: make ${{ matrix.distro }}
      - name: Login to ghcr.io
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build image
        run: cd  containers &&  make ${{ matrix.distro }}
      - name: tag image
        run: docker tag ovirt-imageio-test:fedora-riscv-41 ghcr.io/ffgan/ovirt-ovirt-imageio-test:fedora-riscv-41
      - name: push docker image
        run: docker push  ghcr.io/ffgan/ovirt-ovirt-imageio-test:fedora-riscv-41
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install podman
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Build container images
        run: make container
      - name: Login to ghcr.io
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: tag image
        run: docker tag ovirt-imageio:latest ghcr.io/ffgan/ovirt-imageio:latest
      - name: push docker image
        run: docker push ghcr.io/ffgan/ovirt-imageio:latest
