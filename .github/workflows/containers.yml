name: Containers
on:
  # Be able to run the job manually when needed
  # (Actions -> Containers -> Run workflow)
  workflow_dispatch:
  # Build every week on Monday 00:00
  # schedule:
  #   - cron:  '0 0 * * 1'
  push:
# env:
# IMAGE_REGISTRY: quay.io/ovirt
# can_push: ${{ github.repository_owner == 'oVirt' }}
jobs:
  test-containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # distro: [ centos-9, centos-10, fedora-40, fedora-41 ]
        distro: [fedora-riscv-41]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install podman
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Build container images
        working-directory: containers
        run: make ${{ matrix.distro }}
      - name: Login to ghcr.io
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      - name: Build (and push if main) docker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        id: push-to-ghcr
        with:
          context: containers
          file: containers/${{ matrix.distro }}.containerfile
          tags: ghcr.io/ffgan/${{ matrix.distro }}
          platforms: linux/riscv64
          push: true
      - name: Print image url
        run: echo "Image pushed to ${{ steps.push-to-ghcr.outputs.metadata }}"
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install podman
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Build container images
        run: make container
      - name: Login to ghcr.io
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      - name: Build (and push if main) docker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        id: push-to-ghcr
        with:
          tags: ghcr.io/ffgan/ovirt-imageio
          platforms: linux/riscv64
          push: true
      - name: Print image url
        run: echo "Image pushed to ${{ steps.push-to-ghcr.outputs.metadata }}"
